name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP lint and structure check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Project structure
        run: php scripts/check.php

      - name: Catalog schema test
        run: php tests/catalog_schema_test.php

      - name: Inventory core schema test
        run: php tests/inventory_core_schema_test.php

      - name: Category automatic code test
        run: php tests/category_auto_code_test.php

      - name: Receipts schema test
        run: php tests/receipts_schema_test.php

      - name: Receipts logic test
        run: php tests/receipts_logic_test.php

      - name: Receipt inventory flow test
        run: php tests/receipt_inventory_flow_test.php

      - name: CLI bootstrap session test
        run: php tests/cli_bootstrap_test.php

      - name: Product base variant test
        run: php tests/product_base_variant_test.php

      - name: Production schema test
        run: php tests/production_schema_test.php

      - name: Production logic test
        run: php tests/production_logic_test.php

      - name: RRHH receiver test
        run: php tests/rrhh_receiver_test.php

      - name: Dynamic dashboard test
        run: php tests/dashboard_dynamic_test.php

      - name: UTF-8 repair test
        run: php tests/utf8_repair_test.php

      - name: RRHH people module test
        run: php tests/rrhh_people_module_test.php

      - name: RRHH read-only contract test
        run: php tests/rrhh_readonly_test.php

      - name: Direction and office test
        run: php tests/people_direction_office_test.php

      - name: Warehouses schema test
        run: php tests/warehouses_schema_test.php

      - name: Warehouses logic test
        run: php tests/warehouses_logic_test.php

      - name: Warehouses RRHH test
        run: php tests/warehouses_rrhh_test.php

      - name: Requests schema test
        run: php tests/requests_schema_test.php

      - name: Requests logic test
        run: php tests/requests_logic_test.php

      - name: Central P4 review and tracking test
        run: php tests/central_p4_review_tracking_test.php

      - name: Requests stock reservation test
        run: php tests/requests_stock_test.php

      - name: Distribution schema test
        run: php tests/distribution_schema_test.php

      - name: Distribution logic test
        run: php tests/distribution_logic_test.php

      - name: Distribution accounting test
        run: php tests/distribution_accounting_test.php

      - name: Request distribution verification test
        run: php tests/request_distribution_verification_test.php

      - name: Post phase 8 display test
        run: php tests/post_phase8_display_test.php

      - name: Inventory availability display test
        run: php tests/inventory_availability_test.php

      - name: Individual deliveries schema test
        run: php tests/deliveries_schema_test.php

      - name: Individual deliveries logic test
        run: php tests/deliveries_logic_test.php

      - name: Individual deliveries accounting test
        run: php tests/deliveries_accounting_test.php

      - name: Delivery person history verification test
        run: php tests/delivery_person_history_verification_test.php

      - name: Delivery scope override test
        run: php tests/delivery_scope_override_test.php

      - name: Asset cache busting test
        run: php tests/asset_cache_busting_test.php

      - name: Adjustments schema test
        run: php tests/adjustments_schema_test.php

      - name: Adjustments logic test
        run: php tests/adjustments_logic_test.php

      - name: Adjustments accounting test
        run: php tests/adjustments_accounting_test.php

      - name: Reports logic test
        run: php tests/reports_logic_test.php

      - name: Reports export test
        run: php tests/reports_export_test.php

      - name: Security schema test
        run: php tests/security_schema_test.php

      - name: Authentication logic test
        run: php tests/auth_logic_test.php

      - name: Audit logic test
        run: php tests/audit_logic_test.php

      - name: Security permissions test
        run: php tests/security_permissions_test.php

      - name: Role workflow boundaries test
        run: php tests/role_operation_boundaries_test.php

      - name: Receipt admin draft edit test
        run: php tests/receipt_admin_draft_edit_test.php

      - name: Historical import schema test
        run: php tests/historical_import_schema_test.php

      - name: Spreadsheet reader test
        run: php tests/spreadsheet_reader_test.php

      - name: Boots P4 import prevalidation test
        run: php tests/boots_p4_preview_test.php

      - name: P4 native Excel template round-trip test
        run: php tests/p4_nominal_xlsx_template_test.php

      - name: P4 nominal bulk capture test
        run: php tests/p4_nominal_bulk_test.php

      - name: P4 nominal reconciliation test
        run: php tests/p4_nominal_reconciliation_test.php

      - name: P4 final incidents regression test
        run: php tests/p4_last_incidents_test.php

      - name: P4 manual row identity validation test
        run: php tests/p4_manual_validation_test.php

      - name: P4 direct reviewed XLSX import test
        run: php tests/p4_direct_import_from_review_test.php

      - name: P4 post-import navigation test
        run: php tests/p4_post_import_navigation_test.php

      - name: P4 one-click bulk review test
        run: php tests/p4_bulk_review_test.php

      - name: P4 duplicate nominal rows test
        run: php tests/p4_duplicate_nominal_rows_test.php

      - name: P4 RRHH canonical position test
        run: php tests/p4_rrhh_canonical_position_test.php

      - name: P4 nominal status policy test
        run: php tests/p4_nominal_status_policy_test.php

      - name: P4 last delivery advisory test
        run: php tests/p4_last_delivery_advisory_test.php

      - name: P4 RRHH bulk results visibility test
        run: php tests/p4_rrhh_picker_visibility_test.php

      - name: P4 searchable catalog test
        run: php tests/p4_catalog_search_test.php

      - name: Footwear catalog & sizes test
        run: php tests/footwear_catalog_test.php

      - name: Historical import logic test
        run: php tests/historical_import_logic_test.php

      - name: Historical catalog preparation test
        run: php tests/historical_catalog_logic_test.php

      - name: Historical reconciliation test
        run: php tests/historical_reconciliation_logic_test.php

      - name: Historical closure test
        run: php tests/historical_closure_logic_test.php

      - name: Read-only historical data audit contract test
        run: php tests/historical_data_audit_test.php

      - name: Local demo reset protection test
        run: php tests/local_demo_reset_test.php

      - name: Readiness logic test
        run: php tests/readiness_logic_test.php

      - name: Deployment readiness without databases
        run: php scripts/readiness.php --no-database

      - name: Backup recovery logic test
        run: php tests/backup_recovery_logic_test.php

      - name: Backup command validation
        run: php scripts/backup.php --validate-only

      - name: Restore command validation
        run: php scripts/restore.php --validate-only

      - name: Manuals documentation test
        run: php tests/manuals_logic_test.php

      - name: Deployment logic test
        run: php tests/deployment_logic_test.php

      - name: Windows deployment script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./deploy-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
