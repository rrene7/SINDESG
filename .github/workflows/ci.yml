name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP lint and structure check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Project structure
        run: php scripts/check.php

      - name: Catalog schema test
        run: php tests/catalog_schema_test.php
