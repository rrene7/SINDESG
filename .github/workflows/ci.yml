name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP lint and structure check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Project structure
        run: php scripts/check.php

      - name: Catalog schema test
        run: php tests/catalog_schema_test.php

      - name: Inventory core schema test
        run: php tests/inventory_core_schema_test.php

      - name: Category automatic code test
        run: php tests/category_auto_code_test.php

      - name: Receipts schema test
        run: php tests/receipts_schema_test.php

      - name: Receipts logic test
        run: php tests/receipts_logic_test.php

      - name: CLI bootstrap session test
        run: php tests/cli_bootstrap_test.php

      - name: Product base variant test
        run: php tests/product_base_variant_test.php

      - name: Production schema test
        run: php tests/production_schema_test.php

      - name: Production logic test
        run: php tests/production_logic_test.php

      - name: RRHH receiver test
        run: php tests/rrhh_receiver_test.php

      - name: Dynamic dashboard test
        run: php tests/dashboard_dynamic_test.php

      - name: UTF-8 repair test
        run: php tests/utf8_repair_test.php

      - name: RRHH people module test
        run: php tests/rrhh_people_module_test.php

      - name: RRHH read-only contract test
        run: php tests/rrhh_readonly_test.php
