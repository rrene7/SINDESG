name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP lint and structure check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Project structure
        run: php scripts/check.php

      - name: Catalog schema test
        run: php tests/catalog_schema_test.php

      - name: Inventory core schema test
        run: php tests/inventory_core_schema_test.php

      - name: Category automatic code test
        run: php tests/category_auto_code_test.php

      - name: Receipts schema test
        run: php tests/receipts_schema_test.php

      - name: Receipts logic test
        run: php tests/receipts_logic_test.php

      - name: CLI bootstrap session test
        run: php tests/cli_bootstrap_test.php

      - name: Product base variant test
        run: php tests/product_base_variant_test.php

      - name: Production schema test
        run: php tests/production_schema_test.php

      - name: Production logic test
        run: php tests/production_logic_test.php

      - name: RRHH receiver test
        run: php tests/rrhh_receiver_test.php

      - name: Dynamic dashboard test
        run: php tests/dashboard_dynamic_test.php

      - name: UTF-8 repair test
        run: php tests/utf8_repair_test.php

      - name: RRHH people module test
        run: php tests/rrhh_people_module_test.php

      - name: RRHH read-only contract test
        run: php tests/rrhh_readonly_test.php

      - name: Direction and office test
        run: php tests/people_direction_office_test.php

      - name: Warehouses schema test
        run: php tests/warehouses_schema_test.php

      - name: Warehouses logic test
        run: php tests/warehouses_logic_test.php

      - name: Warehouses RRHH test
        run: php tests/warehouses_rrhh_test.php

      - name: Requests schema test
        run: php tests/requests_schema_test.php

      - name: Requests logic test
        run: php tests/requests_logic_test.php

      - name: Requests stock reservation test
        run: php tests/requests_stock_test.php

      - name: Distribution schema test
        run: php tests/distribution_schema_test.php

      - name: Distribution logic test
        run: php tests/distribution_logic_test.php

      - name: Distribution accounting test
        run: php tests/distribution_accounting_test.php

      - name: Post phase 8 display test
        run: php tests/post_phase8_display_test.php

      - name: Inventory availability display test
        run: php tests/inventory_availability_test.php

      - name: Individual deliveries schema test
        run: php tests/deliveries_schema_test.php

      - name: Individual deliveries logic test
        run: php tests/deliveries_logic_test.php

      - name: Individual deliveries accounting test
        run: php tests/deliveries_accounting_test.php

      - name: Delivery scope override test
        run: php tests/delivery_scope_override_test.php

      - name: Asset cache busting test
        run: php tests/asset_cache_busting_test.php

      - name: Adjustments schema test
        run: php tests/adjustments_schema_test.php

      - name: Adjustments logic test
        run: php tests/adjustments_logic_test.php

      - name: Adjustments accounting test
        run: php tests/adjustments_accounting_test.php

      - name: Reports logic test
        run: php tests/reports_logic_test.php

      - name: Reports export test
        run: php tests/reports_export_test.php

      - name: Security schema test
        run: php tests/security_schema_test.php

      - name: Authentication logic test
        run: php tests/auth_logic_test.php

      - name: Audit logic test
        run: php tests/audit_logic_test.php

      - name: Security permissions test
        run: php tests/security_permissions_test.php

      - name: Historical import schema test
        run: php tests/historical_import_schema_test.php

      - name: Spreadsheet reader test
        run: php tests/spreadsheet_reader_test.php

      - name: Historical import logic test
        run: php tests/historical_import_logic_test.php
